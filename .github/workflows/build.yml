# Daily OmniRoute image built from the head of upstream's default branch.
#
# Upstream's own :next image rarely publishes: every push to the release branch
# cancels the previous build, so it lags the branch by days. This builds the
# current head once a day with the same Dockerfile target and build args as
# upstream's :next, applies the patches in patches/, smoke-tests it offline, and
# only then moves :edge.
name: build

on:
  schedule:
    # 07:17 UTC = 01:17 in Edmonton; finished well before the QNAP watchtower run at 04:17.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream commit already has an image
        type: boolean
        default: false
      ref:
        description: Upstream commit, branch or tag to build instead of the default branch head
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM: diegosouzapw/OmniRoute
  IMAGE: ghcr.io/${{ github.repository_owner }}/omniroute

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" || true

      - name: Resolve upstream head
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          branch=$(gh api "repos/$UPSTREAM" -q .default_branch)
          sha=$(gh api "repos/$UPSTREAM/commits/${REF:-$branch}" -q .sha)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Upstream \`$branch\` at [\`${sha:0:12}\`](https://github.com/$UPSTREAM/commit/$sha)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Patch set id
        id: patches
        # Part of the image tag, so a patch change rebuilds the same upstream commit.
        run: |
          id=$(cat build-repo/patches/*.patch | sha256sum | cut -c1-8)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${{ steps.up.outputs.short }}-p$id" >> "$GITHUB_OUTPUT"
          echo "Patches: $(ls build-repo/patches | tr '\n' ' ')(set \`$id\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip if this commit is already built
        id: done
        run: |
          if [ "${{ inputs.force }}" != "true" ] && docker manifest inspect "$IMAGE:${{ steps.patches.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Free disk and add swap
        if: steps.done.outputs.skip != 'true'
        # The webpack pass needs a 12 GB V8 heap (upstream's own :next build uses the same);
        # the 16 GB runner gets 12 GB of extra swap on top of its default 4 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 12G /mnt/swap-build && sudo chmod 600 /mnt/swap-build
          sudo mkswap /mnt/swap-build && sudo swapon /mnt/swap-build
          free -h && df -h /

      - uses: actions/checkout@v4
        if: steps.done.outputs.skip != 'true'
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.up.outputs.sha }}
          fetch-depth: 1
          path: upstream

      - name: Apply patches
        if: steps.done.outputs.skip != 'true'
        # A patch that no longer applies fails the build, so :edge stays on the last patched image
        # instead of silently shipping an unpatched one.
        working-directory: upstream
        run: |
          for p in ../build-repo/patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --verbose "$p"
          done

      - uses: docker/setup-buildx-action@v3
        if: steps.done.outputs.skip != 'true'

      - name: Build
        if: steps.done.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          target: runner-base
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.up.outputs.sha }}
            org.opencontainers.image.version=${{ steps.up.outputs.branch }}@${{ steps.up.outputs.short }}+p${{ steps.patches.outputs.id }}
          load: true
          push: false
          tags: omniroute:candidate
          cache-from: type=gha,scope=omniroute
          cache-to: type=gha,scope=omniroute,mode=max,ignore-error=true

      - name: Smoke test (offline, empty data dir)
        if: steps.done.outputs.skip != 'true'
        run: |
          docker run -d --name smoke --network none --user 0:0 --init \
            -e DATA_DIR=/app/data -e PORT=20128 omniroute:candidate
          probe='(async()=>{for(const p of ["/api/health","/api/health/ping","/login"]){
            const r=await fetch("http://127.0.0.1:20128"+p,{signal:AbortSignal.timeout(5000)});
            if(!r.ok)throw Error(p+" "+r.status);
            if(p==="/login"){if(!(await r.text()).toLowerCase().includes("<html"))throw Error("login html");}
            else if((await r.json()).status!=="ok")throw Error(p+" status");}})().catch(e=>{console.error(String(e));process.exit(1)})'
          for i in $(seq 1 60); do
            if docker exec smoke node -e "$probe"; then echo "healthy after ${i} tries"; ok=1; break; fi
            sleep 5
          done
          docker logs --tail 40 smoke
          [ "${ok:-0}" = 1 ]

      - name: Push
        if: steps.done.outputs.skip != 'true'
        run: |
          for t in edge "${{ steps.patches.outputs.tag }}"; do
            docker tag omniroute:candidate "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Pushed \`$IMAGE:edge\` and \`$IMAGE:${{ steps.patches.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
